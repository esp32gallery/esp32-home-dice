<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Home Dice · Preview</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
<canvas id="c" width="480" height="480"></canvas>
<script>
/* TryBoard preview protocol v1:
   child -> parent: ready {name, w, h, actions, params}, status {text}
   parent -> child: action {id}, param {key, value}
*/
const zh = new URLSearchParams(location.search).get('lang') === 'zh';
document.documentElement.lang = zh ? 'zh-CN' : 'en';
const text = (en, cn) => zh ? cn : en;
const FRAMES = 13;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

let face = 3, target = 3, seq = [], at = 0, busy = false, token = 0;

const send = (m) => parent.postMessage(m, "*");

async function prep() {
  const my = ++token;
  send({ type: "status", text: text("Loading frames…", "正在加载画面…") });
  try {
    const imgs = await Promise.all(
      Array.from({ length: FRAMES }, (_, i) =>
        new Promise((res, rej) => {
          const im = new Image();
          im.onload = () => res(im);
          im.onerror = rej;
          im.src = `frames/${face}-${target}-${String(i).padStart(2, "0")}.png`;
        }),
      ),
    );
    if (my !== token) return;
    seq = imgs;
    show(0);
    send({type:"loaded"});
  } catch (e) {
    send({ type: "error", text: text("Frame files could not be loaded", "画面文件加载失败") });
  }
}

function show(i) {
  at = i;
  if (seq[i]) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(seq[i], 0, 0);
  }
  send({ type: "status", text: text(`Frame ${at}/${FRAMES - 1} · Target ${target}`, `第 ${at}/${FRAMES - 1} 帧 · 落点 ${target}`) });
}

async function roll() {
  if (busy || !seq.length) return;
  busy = true;
  try {
    const t0 = performance.now();
    for (let i = 1; i < FRAMES; i++) {
      await new Promise((r) => setTimeout(r, Math.max(0, t0 + i * 70 - performance.now())));
      show(i);
    }
    face = target;
    send({ type: "status", text: text(`Result ${target} · ${Math.round(performance.now() - t0)} ms`, `落点 ${target} · ${Math.round(performance.now() - t0)} 毫秒`) });
  } finally {
    busy = false;
  }
}

addEventListener("message", (e) => {
  if (e.source !== parent) return;
  const d = e.data || {};
  if (d.type === "action") {
    if (d.id === "roll") roll();
    if (d.id === "step" && !busy) show((at + 1) % FRAMES);
  }
  if (d.type === "param" && d.key === "target") {
    if (busy || !/^[1-6]$/.test(String(d.value))) return;
    target = +d.value;
    prep();
  }
});

send({
  type: "ready",
  name: text("Home Dice · 3D Dice", "家庭小站 · 3D 骰子"),
  w: 480,
  h: 480,
  actions: [
    { id: "roll", label: text("Roll dice", "抛骰子") },
    { id: "step", label: text("Next frame", "逐帧") },
  ],
  params: [
    { key: "target", label: text("Target", "落点"), options: ["1", "2", "3", "4", "5", "6"], value: "3" },
  ],
});

prep();
</script>
</html>
